services:
  postgres:
    image: postgres:16-alpine
    container_name: gaming-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gaming_marketplace}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gaming_marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-gaming_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gaming-marketplace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - gaming_marketplace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gaming_marketplace_postgres_data:
  gaming_marketplace_redis_data:

